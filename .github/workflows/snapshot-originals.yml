# 原文备份任务：手动触发；下载公开仓库、核验并提交全部技能和完整源码归档。
# 不执行上游程序，不调用模型；中文解读另由研究任务完成。
name: Back up original sources
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'pinned=引用版本，latest=当前版本，both=两者'
        default: both
        type: choice
        options: [both, pinned, latest]
permissions:
  contents: write
concurrency:
  group: original-source-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Collect full archives and all skill directories
        id: collect
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: python3 scripts/run_snapshot_backup.py --mode "$MODE"
      - name: Report collected snapshots
        run: |
          cat snapshots/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Report incomplete collection
        if: steps.collect.outcome == 'failure'
        run: exit 1
