# 原文备份任务：手动触发；下载公开仓库、核验并提交全部技能和完整源码归档。
# 不执行上游程序，不调用模型；中文解读另由研究任务完成。
name: Back up original sources
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'pinned=引用版本，latest=当前版本，both=两者'
        default: both
        type: choice
        options: [both, pinned, latest]
permissions:
  contents: write
concurrency:
  group: original-source-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Collect full archives and all skill directories
        id: collect
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: python3 scripts/collect_snapshots.py --mode "$MODE" --workers 5
      - name: Generate original reading library
        run: python3 scripts/build_original_library.py
      - name: Commit verified snapshots and report
        run: |
          git config user.name "Agent Research Archive"
          git config user.email "archive@users.noreply.github.com"
          git add snapshots catalog/snapshots.json catalog/original-skills.json dashboard/originals
          if ! git diff --cached --quiet; then
            git commit -m "Back up original sources and rebuild full-text skill library"
            git push origin HEAD:main
          fi
          cat snapshots/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Report incomplete collection
        if: steps.collect.outcome == 'failure'
        run: exit 1
